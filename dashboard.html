                    { id: 'client-overview', name: 'Client Portfolio Dashboard', icon: 'fa-chart-column' },
                    { id: 'client-streams', name: 'Active Advisory Streams', icon: 'fa-compass' },
                    { id: 'client-vault', name: 'Confidential Vault & Dossiers', icon: 'fa-vault' },
                    { id: 'client-memos', name: 'Board Presentations & Memos', icon: 'fa-chalkboard-user' },
                    { id: 'client-invoices', name: 'Fiduciary Invoices & Retainers', icon: 'fa-receipt' },
                    { id: 'client-partner', name: 'Direct Partner Access', icon: 'fa-headset' },
                    { id: 'client-vdr', name: 'Transaction Room & VDR', icon: 'fa-lock' },
                    { id: 'client-certifications', name: 'Compliance Certifications', icon: 'fa-certificate' },
                    { id: 'client-security', name: 'Enterprise Account & Security', icon: 'fa-user-shield' },
                    { id: 'client-logout', name: 'Sign Out / Disconnect', icon: 'fa-right-from-bracket', isLogout: true }
                ]
            };

            const roleViews = currentRole === 'Admin' ? adminViews : (currentRole === 'Client' ? clientViews : managerViews);
            const currentSidebarItems = sidebars[currentRole] || sidebars.Manager;

            // 7. Master View Switcher Function
            function switchView(channelId) {
                if (channelId.includes('logout')) {
                    localStorage.removeItem('stackly_auth');
                    sessionStorage.clear();
                    window.location.href = 'signin.html';
                    return;
                } else if (roleViews[channelId]) {
                    viewportContainer.innerHTML = roleViews[channelId]();
                }

                // Scroll smoothly to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // 8. Render Sidebar Items & Attach View Switch Listeners
            const navListEl = document.getElementById('sidebar-nav-list');
            navListEl.innerHTML = '';

            currentSidebarItems.forEach(function (item, index) {
                const li = document.createElement('li');
                li.className = 'dash-nav-item' + (index === 0 ? ' active' : '') + (item.isLogout ? ' logout-nav-item' : '');

                const a = document.createElement('a');
                a.href = item.isLogout ? 'signin.html' : ('#' + item.id);
                a.className = 'dash-nav-link' + (item.isLogout ? ' dash-logout' : '');

                a.innerHTML = `
                    <span class="nav-item-left">
                        <i class="fa-solid ${item.icon}"></i>
                        <span class="nav-item-title">${item.name}</span>
                    </span>
                `;

                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (item.isLogout) {
                        localStorage.removeItem('stackly_auth');
                        sessionStorage.clear();
                        window.location.href = 'signin.html';
                        return;
                    }
                    document.querySelectorAll('.dash-nav-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    switchView(item.id);
                    closeSidebar();
                });

                li.appendChild(a);
                navListEl.appendChild(li);
            });


            // Initial view load
            switchView(currentSidebarItems[0].id);

            // 9. Mobile Drawer Toggle Behavior
            const menuToggleBtn = document.getElementById('dashboard-menu-toggle');
            const sidebarEl = document.getElementById('dash-sidebar');
            const backdropEl = document.getElementById('sidebar-backdrop');
            const closeBtn = document.getElementById('sidebar-close-btn');

            function openSidebar() {
                sidebarEl.classList.add('mobile-open');
                backdropEl.classList.add('active');
                document.documentElement.classList.add('sidebar-locked');
                document.body.classList.add('sidebar-locked');
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebarEl.classList.remove('mobile-open');
                backdropEl.classList.remove('active');
                document.documentElement.classList.remove('sidebar-locked');
                document.body.classList.remove('sidebar-locked');
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            if (backdropEl) {
                backdropEl.addEventListener('click', closeSidebar);
                backdropEl.addEventListener('touchmove', function (e) {
                    e.preventDefault();
                }, { passive: false });
            }

            // 10. Brand Logo Click: Always return to the first page/channel in the current dashboard
            document.querySelectorAll('.brand-home-link').forEach(function (logoLink) {
                logoLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (currentSidebarItems && currentSidebarItems.length > 0) {
                        const firstChannelId = currentSidebarItems[0].id;
                        document.querySelectorAll('.dash-nav-item').forEach((el, idx) => {
                            el.classList.toggle('active', idx === 0);
                        });
                        switchView(firstChannelId);
                        closeSidebar();
                    }
                });
            });

            // 11. Topbar Logout Button
            const topbarLogoutBtn = document.getElementById('dash-logout-btn');
            if (topbarLogoutBtn) {
                topbarLogoutBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    localStorage.removeItem('stackly_auth');
                    window.location.href = 'signin.html';
                });
            }
        });
    </script>
</body>
</html>
